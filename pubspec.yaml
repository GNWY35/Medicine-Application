name: my_medicine_app
description: "Flutter Medicine App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  image_picker: ^1.1.1
  google_fonts: ^6.2.1
  permission_handler: ^12.0.1
  intl: ^0.20.2
  image: ^4.0.17
  http: ^1.2.2
  path_provider: ^2.1.4
  excel: ^4.0.2
  gal: ^2.3.0
  flutter_skill: ^0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/meds.xlsm
    - assets/images/amldac/
